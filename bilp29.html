<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>BIL-P ボールホルダー カラーシミュレーター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:#f0efe9}
.wrap{max-width:460px;margin:0 auto;padding:6px}
h1{font-size:13px;font-weight:700;text-align:center;color:#1a1a1a;margin-bottom:6px}

/* 上段カード */
.top{background:#fff;border-radius:12px;padding:6px;margin-bottom:6px;display:flex;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.07)}

/* ホルダー側（左） */
.left{display:flex;flex-direction:column;gap:6px;flex:1}
.pw{position:relative;line-height:0;flex:1}
#base{display:block;width:100%;height:auto;border-radius:6px}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
#outline{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3}
.rb{width:100%;padding:0;border:1.5px solid #ccc;border-radius:8px;background:#e8e6e0;color:#777;font-size:12px;cursor:pointer;font-family:inherit;height:44px}
.rb:active{background:#d5d3cd}

/* 右列：A〜F */
.right{display:flex;flex-direction:column;gap:4px;width:118px;flex-shrink:0}
.pb{border:2px solid #e0e0e0;border-radius:8px;background:#f5f5f5;cursor:pointer;-webkit-tap-highlight-color:transparent;flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 8px;min-height:44px}
.pb.on{border-color:#1565c0}
.pb:active{opacity:.8}
.pl{font-size:14px;font-weight:700;color:#ccc;line-height:1}
.pv{font-size:9px;color:#bbb;width:100%;text-align:center;margin-top:2px}
.pb.colored .pl{color:white}
.pb.colored .pv{color:rgba(255,255,255,.85)}
.pb.colored.light .pl{color:#333}
.pb.colored.light .pv{color:rgba(0,0,0,.6)}

/* カラーピッカー */
.picker{background:#fff;border-radius:12px;padding:10px 8px 10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cd{width:100%;aspect-ratio:1;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform .1s;-webkit-tap-highlight-color:transparent}
.cd.sel{border-color:#1565c0;transform:scale(1.15)}
.cd:active{transform:scale(.88)}
.savebtn{display:block;width:100%;height:44px;margin-top:14px;border:none;border-radius:8px;background:#1565c0;color:#fff;font-size:14px;font-weight:600;letter-spacing:.05em;cursor:pointer;font-family:inherit}
.savebtn:active{background:#0d47a1}
</style>
</head>

var active=null;
var baseEl=document.getElementById('base');
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var ol=document.getElementById('outline');

function loadMasks(){
  PT.forEach(function(p){
    var img=new Image();
    img.onload=function(){loaded++;if(loaded===PT.length)draw();};
    img.onerror=function(){loaded++;};
    img.src=p.mask;mImgs[p.id]=img;
  });
}
function syncSize(){
  var w=baseEl.naturalWidth||300,h=baseEl.naturalHeight||375;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  cv.style.width=baseEl.offsetWidth+'px';cv.style.height=baseEl.offsetHeight+'px';
  ol.style.width=baseEl.offsetWidth+'px';ol.style.height=baseEl.offsetHeight+'px';
}

    var mi=mImgs[id];
    if(!p||!p.cur||!mi||!mi.complete||!mi.naturalWidth)return;
    var oc=document.createElement('canvas');oc.width=W;oc.height=H;
    var oc2=oc.getContext('2d');
    var rgb=hexRgb(p.cur);
    oc2.fillStyle='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
    oc2.fillRect(0,0,W,H);
    oc2.globalCompositeOperation='destination-in';
    oc2.drawImage(mi,0,0,W,H);ctx.drawImage(oc,0,0);
  });
}
/* スクロールで消えない対策 */
document.addEventListener('visibilitychange',function(){if(!document.hidden)draw();});
var st=null;
window.addEventListener('scroll',function(){clearTimeout(st);st=setTimeout(draw,80);},false);
window.addEventListener('focus',function(){draw();});
window.addEventListener('pageshow',function(){draw();});
window.addEventListener('resize',function(){syncSize();draw();});
baseEl.onload=function(){syncSize();loadMasks();};
if(baseEl.complete&&baseEl.naturalWidth){syncSize();loadMasks();}

function getN(h){if(!h)return'未選択';var f=CL.find(function(c){return c.h===h;});return f?f.n:'－';}
function isLight(hex){
  if(!hex)return false;
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000>170;
}

function rParts(){
  var g=document.getElementById('pg');g.innerHTML='';
  PT.forEach(function(p){
    var d=document.createElement('div');
    var colored=!!p.cur;
    d.className='pb'+(active===p.id?' on':'')+(colored?' colored':'')+(colored&&isLight(p.cur)?' light':'');
    if(colored){
      var cl=CL.find(function(c){return c.h===p.cur;});
      if(cl&&cl.pearl){
        d.style.background='conic-gradient(from 180deg,#ffffff,#eef0ee,#ffffff,#f2efe9,#ffffff)';
      }else{
        d.style.background=p.cur;
        if(p.cur==='#ffffff')d.style.border='2px solid #ddd';
      }
    }
    d.innerHTML='<span class="pl">'+p.label+'</span><span class="pv">'+getN(p.cur)+'</span>';
    d.onclick=function(){active=p.id;render();};
    g.appendChild(d);
  });
}
function rPick(){
  var g=document.getElementById('cg'),tip=document.getElementById('ct');
  g.innerHTML='';
  CL.forEach(function(c){
    var p=active?PT.find(function(p){return p.id===active;}):null;
    var el=document.createElement('div');
    el.className='cd'+(p&&p.cur===c.h?' sel':'');
    if(c.pearl){
      el.style.background='conic-gradient(from 180deg,#ffffff,#eef0ee,#ffffff,#f2efe9,#ffffff)';
    }else{
      el.style.background=c.h;
      if(c.h==='#ffffff')el.style.border='2.5px solid #ddd';
    }
    el.onmouseenter=function(){tip.textContent=c.n;};
    el.onmouseleave=function(){tip.textContent='';};
    el.ontouchstart=function(){tip.textContent=c.n;};
    el.onclick=function(){
      if(!active)return;
      var p=PT.find(function(p){return p.id===active;});
      p.cur=c.h;draw();render();
      tip.textContent=c.n;
    };
    g.appendChild(el);
  });
}
function render(){rParts();rPick();}
function resetAll(){PT.forEach(function(p){p.cur=null;});active=null;draw();render();}

function saveCard(){
  var scale=3;
  var topEl=document.querySelector('.top');
  var leftEl=document.querySelector('.left');
  var rightEl=document.querySelector('.right');
  var topRect=topEl.getBoundingClientRect();
  var leftRect=leftEl.getBoundingClientRect();
  var rightRect=rightEl.getBoundingClientRect();

  // キャンバス作成（topの幅×高さ）
  var W=Math.round(topRect.width)*scale;
  var H=Math.round(topRect.height)*scale;
  var oc=document.createElement('canvas');
  oc.width=W; oc.height=H;
  var octx=oc.getContext('2d');
  octx.scale(scale,scale);

  // 背景を白で塗る
  octx.fillStyle='#fff';
  octx.fillRect(0,0,topRect.width,topRect.height);

  // base画像を描画
  var bRect=baseEl.getBoundingClientRect();
  var bx=bRect.left-topRect.left, by=bRect.top-topRect.top;
  octx.drawImage(baseEl,bx,by,bRect.width,bRect.height);

  // 色合成済みcanvasを描画
  octx.drawImage(cv,bx,by,bRect.width,bRect.height);

  // アウトライン画像を描画
  var outlineEl=document.getElementById('outline');
  octx.drawImage(outlineEl,bx,by,bRect.width,bRect.height);

  // A〜Fのパーツボタンを描画（リセットボタンは除外）
  document.querySelectorAll('#pg .pb').forEach(function(pb){
    var pr=pb.getBoundingClientRect();
    var px=pr.left-topRect.left, py=pr.top-topRect.top;
    var pw=pr.width, ph=pr.height;

    // 枠
    var isOn=pb.classList.contains('on');
    octx.strokeStyle=isOn?'#1565c0':'#e0e0e0';
    octx.lineWidth=isOn?2:2;
    octx.fillStyle=pb.classList.contains('colored')?'':  '#f0f0f0';

    // パーツIDと色を取得
    var label=pb.querySelector('.pl');
    var valEl=pb.querySelector('.pv');
    var id=label?label.textContent:'';
    var p=PT.find(function(p){return p.id===id;});

    // 背景色
    if(p&&p.cur){
      var cl2=CL.find(function(c){return c.h===p.cur;});
      if(cl2&&cl2.pearl){
        var grad=octx.createConicGradient?octx.createConicGradient(Math.PI,px+pw/2,py+ph/2):null;
        if(grad){
          grad.addColorStop(0,'#ffffff');grad.addColorStop(0.25,'#eef0ee');
          grad.addColorStop(0.5,'#ffffff');grad.addColorStop(0.75,'#f2efe9');
          grad.addColorStop(1,'#ffffff');
          octx.fillStyle=grad;
        }else{octx.fillStyle='#f0f0ee';}
      }else{
        octx.fillStyle=p.cur;
      }
    }else{
      octx.fillStyle='#f0f0f0';
    }
    octx.beginPath();
    octx.roundRect?octx.roundRect(px,py,pw,ph,8):octx.rect(px,py,pw,ph);
    octx.fill();
    octx.stroke();

    // Aラベル
    octx.font='bold 14px "Hiragino Sans","Noto Sans JP",sans-serif';
    octx.fillStyle=p&&p.cur?(isLight(p.cur)?'#333':'#fff'):'#ccc';
    octx.textAlign='left';
    octx.textBaseline='middle';
    octx.fillText(id,px+10,py+ph/2-6);

    // 色名
    var name=p&&p.cur?getN(p.cur):'未選択';
    octx.font='9px "Hiragino Sans","Noto Sans JP",sans-serif';
    octx.fillStyle=p&&p.cur?(isLight(p.cur)?'rgba(0,0,0,.6)':'rgba(255,255,255,.85)'):'#bbb';
    octx.textAlign='center';
    octx.fillText(name,px+pw/2,py+ph/2+7);
  });

  oc.toBlob(function(blob){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='BIL-P_holder.png';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
  },'image/png');
}
render();
</script>
